# How the wallet behaves, for developers. Brands don't set these: see "Wallet settings" in docs/DEVELOPMENT.md.
#
# Each key becomes a field of WalletSettings, and the comment above it the field's documentation. The name says what the number does,
# and a key ending in .millis is a time in milliseconds, whose comment says its default and bounds as durations too (250ms, 5m, 1d).
# "Allowed" and those durations are checked when the app is built.
#
# Override one for a build with -Pscan.stop.after.unused.keys=30 or WW_SCAN_STOP_AFTER_UNUSED_KEYS=30. A release build refuses overrides.

# Looking for what a recovery phrase used

# Unused keys in a row that end a scan of a key chain or a share, on a refresh, a restore or adding a mint. Allowed: 1 to 1000.
scan.stop.after.unused.keys=20
# Unused shares in a row that end the look at an account on a restore or adding a mint. An address that was never paid leaves its
# share unused, and each unused share costs scan.stop.after.unused.keys lookups. Allowed: 1 to 1000.
scan.stop.after.unused.shares=20
# Unused accounts in a row that end a restore or adding a mint. It also limits adding accounts: a new account is refused while
# this many right before it are unused, so a restore always reaches it; 1 is the BIP-44 rule. Allowed: 1 to 100.
scan.stop.after.unused.accounts=1
# Accounts a restore or adding a mint looks at, however many the brand allows. Accounts the wallet has are always looked at.
# Allowed: 1 to 1000.
scan.max.accounts.checked=100
# Key lookups sent to one mint at once, by a refresh, a restore, adding a mint or "Scan for notes" (also for the notes it holds). Their
# answers are applied in key order, so a scan finds and stops at the same keys as one at a time; when it stops early, up to this many
# minus one answers are dropped. When a lookup among several gets no answer, that key is asked again alone and that mint gets one at a
# time for the rest of that refresh, restore or scan, on every key chain; the next one tries again. If it fails alone too, the scan of
# that mint stops. Allowed: 1 to 32.
scan.lookups.at.once=8

# Lightning addresses

# Shares past those handed out that a check of an address's owner tries. Each one is a write request to the mint, on every check.
# Allowed: 0 to 100.
address.check.extra.shares.tried=3
# Shares a registration tries while the mint says each was registered before, by another phone with the phrase. Allowed: 1 to 100.
address.registration.max.shares.tried=5

# New keys

# Keys a new note tries while the mint says each is already in use: it holds keys of another phone's unpaid invoices, which can follow
# each other. Allowed: 1 to 1000.
new.note.max.keys.tried.while.in.use=20
# Keys passed over while looking for the next one no note of the wallet is on. Allowed: 1 to 1000000.
new.key.max.used.keys.skipped=10000

# Payments

# Retries of one payment after the mint refused a note it doesn't know or already burned: each leaves that note out. Other failures
# are not retried. Allowed: 0 to 9.
payment.max.retries.after.unknown.note=2
# How long a payment waits before it first asks the mint whether it settled; the wait doubles each time. Default: 250ms.
# Allowed: 10 to 60000 (10ms to 1m).
payment.status.first.wait.millis=250
# The longest a payment waits between asking the mint whether it settled. Default: 3s. Allowed: 10 to 600000 (10ms to 10m).
payment.status.longest.wait.millis=3000
# How long a payment request whose answer was lost may still be on its way, before an outstanding note means it failed.
# Default: 2m. Allowed: 1000 to 3600000 (1s to 1h).
payment.lost.answer.wait.millis=120000
# How long after an unpaid invoice expires it counts as failed: a payment may still be in flight. Default: 10m.
# Allowed: 0 to 86400000 (0 to 1d).
payment.expired.invoice.wait.millis=600000
# The longest refusal of a mint shown as its own words; the rest is cut off. Allowed: 1 to 1000.
payment.mint.message.max.characters=200

# Notes

# Notes spent by one merge request: they travel in its URL, and LUD-25 says 8 to 12 fit common limits. lnurl-mint refuses more than
# 100. A merge of more notes goes out as several requests. Allowed: 2 to 50.
note.merge.max.notes.per.request=10
# Steps a note strategy may take per mint in one run, so one that never settles still ends; the next refresh goes on. Allowed: 1 to 1000.
note.maintenance.max.steps.per.mint.per.run=50
# How long the mint gets to know a note again after it said it doesn't know it, from when the wallet set the note aside: during
# this grace period the note is asked about often, after it seldom. 0 is no grace period. Default: 1d.
# Allowed: 0 to 2592000000 (0 to 30d).
unknown.note.grace.period.millis=86400000
# How often the mint is asked again about a note it didn't know, during the note's grace period. Default: 5m.
# Allowed: 1000 to 86400000 (1s to 1d).
unknown.note.check.interval.in.grace.period.millis=300000
# How often the mint is asked again about a note it didn't know, after the note's grace period. Default: 1d.
# Allowed: 60000 to 2592000000 (1m to 30d).
unknown.note.check.interval.after.grace.period.millis=86400000

# Screens

# How long a page that is still reading what it shows stays empty before it shows the loading indicator: a page that is ready sooner
# never shows it. Default: 400ms. Allowed: 0 to 10000 (0 to 10s).
loading.indicator.shown.after.millis=400
# How long the loading indicator stays once it is shown, even if the page is ready sooner, so it never blinks.
# Default: 500ms. Allowed: 0 to 10000 (0 to 10s).
loading.indicator.shown.at.least.millis=500

# Back online

# How long the wallet waits, once the phone has a network again, for the system to find that it reaches the internet before it asks the
# mints again: asked at once, the first requests could go out before the network carries them. A network the system never finds to
# reach the internet (one that blocks the system's check) is asked after this wait all the same. Default: 10s.
# Allowed: 0 to 60000 (0 to 1m).
back.online.verified.wait.millis=10000

# Developer key screen

# Keys the screen lists at most. Allowed: 1 to 100000.
key.screen.max.keys.listed=500
# Keys one scan on the screen looks up at most. Allowed: 1 to 1000000.
key.screen.max.keys.scanned=1000
