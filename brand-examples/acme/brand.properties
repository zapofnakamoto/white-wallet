# A second, fictional brand: proof that a fork only edits its brand directory. Build it with
#   ./gradlew :app:assembleDebug -PbrandDir=brand-examples/acme
# It locks users to one provider and one account, sets up in one tap without an address, shows sats, and calls the
# custodian a "provider" (see res/values/strings.xml). Its code/ module adds a note strategy of its own,
# "tidy-small", which new accounts start with.
appName=Acme Cash
applicationId=com.example.acmecash
versionCode=3
versionName=0.3.0
defaultMintHost=cash.acme.example
mintSuggestions=
allowMintChange=false
defaultAmountUnit=sats
# One-tap setup: no address asked for (one provider, so setup is a single button), one account, no switcher; up to
# two addresses per account, if users want them.
requireAddress=false
maxAccounts=1
maxAddresses=2
noteStrategies=tidy-small,single,manual
defaultNoteStrategy=tidy-small
# Notes from other mints go to Acme automatically, if moving them costs at most 5 %.
collectAtHomeMint=on
collectFeeCap=5
supportUrl=https://acme.example/help
