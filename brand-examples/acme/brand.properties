# A second, fictional brand: proof that a fork only edits its brand directory. Build it with
#   ./gradlew :app:assembleDebug -PbrandDir=brand-examples/acme
# It locks users to one provider and one account, sets up in one tap without an address, shows sats, and calls the
# custodian a "provider" and its notes "banknotes" (see res/values/strings.xml). Its code/ module draws notes as
# banknotes (AcmeDesign) and adds a note strategy of its own, "combine-small", which new accounts start with.
app.name=Acme Cash
app.id=com.example.acmecash
app.version.code=8
app.version.name=0.6.2
app.supportUrl=https://acme.example/help
mints.suggestions=localhost:8111
mints.custom=false
mints.changeable=false
# One-tap setup: no address asked for (one provider, so setup is a single button), one account, no switcher; up to
# two addresses per account, if users want them.
accounts.max=1
addresses.max=2
addresses.lightning=none
amounts.unit.default=sats
notes.strategies=combine-small,single,manual
notes.strategy.default=combine-small
# Notes from other mints go to Acme automatically, if moving them costs at most 5 %.
notes.collect.atHomeMint=on
notes.collect.feeCap=5
