# Zapstore listing for this brand, read by the zsp CLI (https://github.com/zapstore/zsp). The repository root has a
# symlink to this file, because Zapstore looks for zapstore.yaml there. A fork replaces every value with its own,
# including `pubkey` (its Nostr identity, filled in by `zsp publish --wizard`). See docs/WHITE_LABEL.md §4.
repository: https://github.com/zapofnakamoto/white-wallet
release_source: ./app/build/outputs/apk/release/app-release.apk
name: White Wallet
summary: Bearer notes on Lightning, with a Lightning address
description: |
  A Lightning wallet built on LNURLcash: your money is held as bearer notes on a mint you choose, and your
  recovery phrase stays on your phone.

  - A Lightning address that receives while you're offline
  - Pay invoices and Lightning addresses, or hand out a note as a link
  - Claim notes from links, QR codes and NFC tags
  - Several accounts, encrypted storage, optional app lock
tags:
  - bitcoin
  - lightning
  - wallet
license: MIT
website: https://example.com
# icon: defaults to the launcher icon in the APK; images: add screenshots (local paths or URLs).
