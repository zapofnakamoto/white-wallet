org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Memory: a parallel build runs one forked JVM per worker (test JVMs, 512m of heap each), and by default one worker per core.
# At most 6 workers, and a Kotlin daemon smaller than the Gradle one (it would take the Gradle daemon's 4g).
# Override per machine in ~/.gradle/gradle.properties or with -Dorg.gradle.workers.max=N.
org.gradle.workers.max=6
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# A lint crash shows what went wrong, not only that it did.
android.lint.printStackTrace=true
