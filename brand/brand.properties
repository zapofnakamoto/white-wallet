# Everything a fork changes to rebrand the app. See docs/WHITE_LABEL.md.

# The app
app.name=White Wallet
app.id=com.example.whitewallet
app.version.code=10
app.version.name=0.7.0
# How finished the app is, shown at setup and in About: auto = beta while app.version.name is below 1.0.0, then
# stable; or alpha, beta, stable as set.
app.releaseStage=auto
app.supportUrl=https://example.com

# Mints
# The LNURLcash mints offered at setup and restore (host, optionally with :port; comma-separated), the first one
# preselected. Empty: users bring their own mint (needs mints.custom=true).
mints.suggestions=mint.lnurlcash.com
# true: users may also use mints not suggested above: type one at setup ("Custom…"), add one under Settings → Mints,
# make it their home mint. false: only the suggested mints can be a home, hold an address or receive moved money;
# notes from any mint can still be claimed.
mints.custom=true
# true: after setup, users can add an address on another mint, change their home mint and move money between mints.
# false: each account stays on the mint it was set up with.
mints.changeable=true
# false hides everything about mints: Settings → Mints, the home mint's page, which mint a claimed note is on, and
# the mints in the notes view.
mints.visible=true
# Mints shown as trusted from the start, each as host:pubkey (the mint's signing key, 66 hex characters), comma-
# separated. Trust is tied to the key: if the mint ever presents another one, it isn't trusted. Users can untrust
# them. Each wallet's home mint is trusted by default anyway.
mints.trusted=

# Accounts and Lightning addresses
# Accounts the app holds (1 hides everything about accounts) and Lightning addresses an account may register per
# mint. 0 means no limit.
accounts.max=0
wallets.max=0
addresses.max=1
# Lightning addresses at setup: required = setup asks for a name, optional = it asks but users may continue without
# one, none = setup only creates the account (a single button when there is only one mint to pick). Without an address,
# users receive by invoice and can still get one later in Settings.
addresses.lightning=optional
# When a mint charges for an address, what setup does: ask = shows the fee and lets users choose, reserve = holds the name
# and asks for the fee, skip = goes on without an address (asks instead if addresses.lightning=required).
addresses.fee.onboarding=ask
# The most an address may cost, in sats; 0 = what the mint advertises. Settings always shows the fee first.
addresses.fee.max=0

# Amounts
# How amounts are shown until the user picks a unit in Settings: bitcoin (BIP-177, the smallest unit as a whole
# number with the symbol: ₿1,000) or sats (1,000 sats). Same numbers either way.
amounts.unit.default=bitcoin
# Whether users may switch the unit under Settings → Amounts. With false, the page is gone and amounts always show
# in amounts.unit.default.
amounts.unit.changeable=true

# Notes
# Where users manage their notes (share, split, combine, recheck, renew): tab = a Notes tab next to Wallet and
# History, settings = a page under Settings → Account, hidden = nowhere (the note strategy keeps them by itself).
notes.view=tab
# What users can do with their notes in the notes view, comma-separated: share (as a QR code), split, combine, move
# (to another mint; needs mints.visible=true), recheck, renew, print (a handed-out note, on paper). Without combine,
# move and recheck there is no selecting.
# Unset = all of them (without move when mints.visible=false); empty = notes are only shown.
notes.actions=share,split,combine,move,recheck,renew,print
# Note strategies users can choose from, in this order (built in: single = keep only one note, manual = keep notes
# as they arrive; a brand's code/ module can add its own), and the one a new account starts with.
notes.strategies=single,manual
notes.strategy.default=manual
# "Collect at home mint": notes on other mints are moved to the wallet's home mint automatically, when the move
# costs at most notes.collect.feeCap percent. hidden = not offered, off = offered and starts off, on = offered and
# starts on, always = every wallet collects and users have no switch.
notes.collect.atHomeMint=off
notes.collect.feeCap=2
# A short message when the wallet changed the notes by itself (combined, split, renewed, moved home): hidden = never,
# off / on = a switch under Note settings that starts off / on, always = always, no switch. With notes.view=hidden,
# whenNotesHidden=true still tells what the balance did.
notes.maintenance.notices=on
notes.maintenance.notices.whenNotesHidden=true
# The fee caps users pick from for collecting, in percent, comma-separated (an account's own cap stays selectable).
notes.collect.feeCaps=1,2,5,10
# How long collecting leaves a mint alone after a move from it failed.
notes.collect.retryAfter=1h
# How long a received note its mint keeps refusing (not as spent, unknown or locked) is tried again before it's given up.
notes.received.giveUpAfter=7d

# History
# Filters on the History tab: types = received, sent, moved and note maintenance, maintenance = only showing or
# hiding note maintenance, none = no filters (note maintenance stays hidden).
history.filter=types

# Backup
# backup.required: never = Home reminds users to write down their recovery phrase, setup = a new account's phrase is
# written down and checked during setup, with no way past it (a phone without a screen lock can still skip). A restored
# account is never asked. backup.reminder.above: Home's reminder shows once the balance is above this many sats.
backup.required=never
backup.reminder.above=0

# Security
# The app lock (asking for the phone's own lock when the app opens): off = users may switch it on, on = it starts on and
# users may switch it off, always = always on, no switch. A phone without a screen lock still opens the app.
security.appLock=off
# How long the app may be in the background before the lock asks again (0s = every time).
security.appLock.relockAfter=30s
# When a copied secret (the recovery phrase, a note, a watch-only key) is cleared from the clipboard.
security.clipboard.clearAfter=60s

# Timings, each a number with its unit: ms, s, m, h or d.
# Connecting to a mint, and waiting for its answer.
network.timeout.connect=15s
network.timeout.read=30s
# Refreshing in the background (at least 15m, Android's limit); while Receive is open, for payments to the address;
# while an invoice is shown; while a handed-out note's page is open, for whether it was claimed; and how long a payment
# is waited for before it shows as pending.
sync.background=15m
sync.receive=15s
sync.invoice=3s
sync.sharedNote=10s
sync.paymentWait=30s

# Developer options in Settings: shown = always, unlock = hidden until the version in About is tapped seven times,
# hidden = never in release builds (debug builds treat hidden as unlock).
developer.options=shown
