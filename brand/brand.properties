# Everything a fork changes to rebrand the app. See docs/WHITE_LABEL.md.
appName=White Wallet
applicationId=com.example.whitewallet
versionCode=1
versionName=0.1.0
# The LNURLcash mint preselected during onboarding (host, optionally with :port).
defaultServiceHost=mint.lnurlcash.com
# Mints offered in the onboarding dropdown (comma-separated; the default is always included). Users can also pick "Custom".
serviceSuggestions=mint.lnurlcash.com
allowServiceChange=true
# How amounts are shown until the user picks a unit in Settings: bitcoin (BIP-177, the smallest unit as a whole
# number with the symbol: ₿1,000) or sats (1,000 sats). Same numbers either way.
defaultAmountUnit=bitcoin
# Whether users may switch the unit under Settings → Amounts. With false, the page is gone and amounts always show in
# defaultAmountUnit.
allowUnitChange=true
# Whether every account needs a Lightning Address. With false, setup only creates the account (a single button when
# allowServiceChange=false); users receive by invoice and can still get an address later in Settings.
requireAddress=true
# Accounts the app holds (1 hides everything about accounts) and Lightning Addresses an account may register per
# mint. 0 means no limit.
maxAccounts=0
maxAddresses=1
# Note strategies users can choose from, in this order (built in: single = keep only one note, manual = keep notes as
# they arrive; a brand's code/ module can add its own), and the one a new account starts with.
noteStrategies=single,manual
defaultNoteStrategy=single
# "Collect at home mint": notes on other mints are moved to the account's home mint automatically, when the move
# costs at most collectFeeCap percent. hidden = not offered, off = offered and starts off, on = offered and starts on,
# always = every account collects and users have no switch.
collectAtHomeMint=off
collectFeeCap=2
# Where users manage their notes (share, split, combine, recheck, renew): tab = a Notes tab next to Wallet and
# History, settings = a page under Settings → Account, hidden = nowhere (the note strategy keeps them by itself).
notesView=tab
# false hides everything about mints: Settings → Mints, the home mint's page, and which mint a claimed note is on.
showMints=true
# Developer options in Settings: shown = always, unlock = hidden until the version in About is tapped seven times,
# hidden = never in release builds (debug builds treat hidden as unlock).
developerOptions=shown
# Mints shown as trusted from the start, each as host:pubkey (the mint's signing key, 66 hex characters), comma-
# separated. Trust is tied to the key: if the mint ever presents another one, it isn't trusted. Users can untrust
# them. Each account's home mint is trusted by default anyway.
trustedMints=
supportUrl=https://example.com
