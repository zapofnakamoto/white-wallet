# Build, test and lint every push and pull request, build both brands and draw their screenshots. On a version tag (v0.1.0), create the
# GitHub release with that version's CHANGELOG.md section. No APK: brands build, sign and publish their own
# (WHITE_LABEL.md §4).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The conformance suite's mock mint, for the integration tests (they are skipped without it).
      - name: LNURLcash conformance suite
        run: dev/conformance.sh

      - name: No brand values outside brand/
        run: |
          dev/check-brand.sh brand
          dev/check-brand.sh brand-examples/acme

      - name: Screens draw through the brand's design
        run: dev/check-design.sh

      - name: No screen state starts as something it isn't
        run: dev/check-flash.sh

      - name: No note is looked up at a mint whose signing key wasn't checked
        run: dev/check-lookups.sh

      - name: No resource name is defined in two modules
        run: dev/check-resources.sh

      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Unit and integration tests, lint, debug build
        run: ./gradlew test :feature:settings:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          retention-days: 7
          path: |
            **/build/reports/
            **/build/test-results/

  screenshots:
    # The previews drawn in each sample brand's design (docs/DEVELOPMENT.md, "Screenshots") and compared with the render
    # of the push before (or a pull request's base), kept in the Actions cache: never drawn again. It fails only when a
    # preview can't be drawn; what changed is in the job summary and the screenshots artifact (index.html).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # name: the brand directory's own name, which its screenshots folder is called after.
        include:
          - { brand: brand, name: brand }
          - { brand: brand-examples/acme, name: acme }
    env:
      OUT: screenshots/build/screenshots/check/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The render before
        id: before
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: screenshots-before
          key: screenshots-${{ matrix.name }}-${{ github.event.pull_request.base.sha || github.event.before }}
          # That push's run cancelled or failed: the newest render kept instead (the summary says which).
          restore-keys: screenshots-${{ matrix.name }}-

      - name: Draw the previews
        run: ./gradlew :screenshots:renderScreenshots -Pscreenshots=check -PbrandDir=${{ matrix.brand }}

      - name: What changed
        shell: bash
        run: |
          echo "Compared with: ${{ steps.before.outputs.cache-matched-key || 'nothing' }}" >> "$GITHUB_STEP_SUMMARY"
          dev/screenshots.py "$OUT" --render screenshots/build/screenshots/render --previous screenshots-before | tee -a "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' "$OUT/changed.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep this render for the next push
        if: github.event_name == 'push'
        run: rm -rf screenshots-before && cp -r "$OUT/current" screenshots-before
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: screenshots-before
          key: screenshots-${{ matrix.name }}-${{ github.sha }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ env.OUT }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles(format('{0}/diff/*.png', env.OUT)) != ''
        with:
          name: screenshots-changed-${{ matrix.name }}
          retention-days: 7
          path: |
            ${{ env.OUT }}/diff/
            ${{ env.OUT }}/changed.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-reports-${{ matrix.name }}
          retention-days: 7
          path: screenshots/build/reports/

  regtest:
    # The wallet against the real reference mints on regtest Lightning (dev/regtest): the proof for every change that
    # talks to a mint (CONTRIBUTING.md). With LNURLCASH_REGTEST=1 a regtest test fails, rather than skips, when the
    # stack is down; the last step makes sure none was skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start the regtest stack
        run: dev/regtest/regtest.sh up

      - name: Regtest tests, with coverage
        env:
          LNURLCASH_REGTEST: "1"
        run: ./gradlew :core:wallet:test --tests '*Regtest*' :core:wallet:jacocoTestReport :core:data:testDebugUnitTest --tests '*Regtest*'

      - name: Every regtest test ran
        run: |
          results=(core/wallet/build/test-results/test/TEST-*Regtest*.xml core/data/build/test-results/testDebugUnitTest/TEST-*Regtest*.xml)
          [[ -e "${results[0]}" ]] || { echo "No regtest test results." >&2; exit 1; }
          if grep -h '<skipped' "${results[@]}"; then echo "Regtest tests were skipped (above)." >&2; exit 1; fi

      - name: Stack logs
        if: failure()
        run: docker compose -p whitewallet-regtest -f dev/regtest/docker-compose.yml logs --no-color > regtest-logs.txt 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: regtest-reports
          path: |
            core/wallet/build/reports/
            core/wallet/build/test-results/
            core/data/build/test-results/
            regtest-logs.txt

  brands:
    # Proves that a fork only edits its brand directory: each sample brand builds as its own app.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        brand: [brand, brand-examples/acme]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :app:assembleRelease -PbrandDir=${{ matrix.brand }}

  new-brand:
    # The brand scaffolder: its own tests, then a generated brand passes the brand check and builds.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: python3 -m unittest discover -s dev -p 'test_*.py'
      - run: >
          dev/new-brand.sh --name "CI Cash" --id org.ci.cash --mint mint.ci.example --primary "#6A1B9A"
          --logo brand/res/drawable/ic_launcher_foreground.xml --out build/ci-brand --no-mint-check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, regtest, brands]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section '## [$version]'." >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "White Wallet $version" --notes-file "$RUNNER_TEMP/notes.md"
